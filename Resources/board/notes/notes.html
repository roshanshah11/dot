<!doctype html>
<html><head><meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src dotnotes:; style-src dotnotes: 'unsafe-inline'; font-src dotnotes: data:; img-src dotnotes: data:">
<title>Notes</title>
<link rel="stylesheet" href="../katex/katex.min.css">
<link rel="stylesheet" href="notes.css">
<script src="../katex/katex.min.js"></script>
<script src="notes.js"></script>
</head><body>
<div id="live">
  <header id="head">
    <div id="course"></div>
    <div id="heading"><span id="heading-key"></span><span id="heading-sep">: </span><span id="title" contenteditable="plaintext-only" spellcheck="false" autocorrect="off" autocapitalize="off" data-placeholder="add a title" title="the class's title: click to type it"></span></div>
    <div id="bar"><span id="status"></span><button id="end" type="button">End class</button></div>
  </header>
  <main id="scroller"><div id="lines"></div><div id="room"></div><div id="source" hidden></div></main>
  <footer id="hearing" hidden><span id="hearing-text"></span></footer>
  <section id="dock" hidden>
    <div id="recall" hidden>
      <div id="recall-history"></div>
      <div id="recall-now">
        <div class="dock-top"><span id="recall-prompt"></span><span id="countdown"></span></div>
        <textarea id="recall-text" rows="4" placeholder="in your own words"></textarea>
        <div class="dock-bar"><button id="skip" type="button" class="quiet">Skip</button><button id="submit" type="button">Submit</button></div>
      </div>
      <div id="feedback" hidden></div>
    </div>
    <div id="deadlines" hidden>
      <div class="dock-top"><span class="dock-title">Deadlines from class</span></div>
      <div id="deadline-list"></div>
      <div class="dock-bar" id="deadline-bar"><button id="deadline-skip" type="button" class="quiet">Skip</button><button id="deadline-add" type="button">Add to Atlas</button></div>
      <div id="deadline-result" hidden></div>
    </div>
    <div id="saved" hidden></div>
  </section>
  <div id="lightbox" hidden><figure><img alt=""><figcaption></figcaption></figure></div>
</div>
<article id="doc" hidden></article>
</body></html>
