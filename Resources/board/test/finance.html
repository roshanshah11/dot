<div class="fixture"><div class="tag">.sens with numbers that do not read</div>
<div class="sens" id="bad-json" data-source="Fixture"><script type="application/json">{"wacc": [8, 9,</script></div></div>

<script>
  // Copies of the fixtures' numbers, taken before board.js draws the pieces (drawing replaces them).
  var FIX = {};
  document.querySelectorAll(".football, .sens, .comps").forEach(function (p) {
    try { FIX[p.id] = JSON.parse(p.querySelector('script[type="application/json"]').textContent); } catch (e) {}
  });
  document.addEventListener("DOMContentLoaded", function () {
    var B = window.Board, rows = [], pass = 0, fail = 0;
    function check(label, actual, expected) {
      var ok = typeof expected === "number" && typeof actual === "number" ? (isNaN(expected) ? isNaN(actual) : Math.abs(actual - expected) < 5e-5) : actual === expected;
      ok ? pass++ : fail++;
      rows.push((ok ? "PASS " : "FAIL ") + label + " = " + JSON.stringify(actual) + (ok ? "" : " (expected " + JSON.stringify(expected) + ")"));
    }
    var fmt = B.fmt, r4 = function (v) { return Math.round(v * 1e4) / 1e4; };
    // fmt: banking conventions
    check('fmt(12.345, "x")', fmt(12.345, "x"), "12.3x");
    check('fmt(-3.2, "x")', fmt(-3.2, "x"), "NM");
    check('fmt(0, "x")', fmt(0, "x"), "0.0x");
    check('fmt(9, "%")', fmt(9, "%"), "9.0%");
    check('fmt(-2.34, "%")', fmt(-2.34, "%"), "(2.3%)");
    check('fmt(-0.04, "%")', fmt(-0.04, "%"), "0.0%");
    check('fmt(25, "bp")', fmt(25, "bp"), "25bp");
    check('fmt(-50, "bp")', fmt(-50, "bp"), "(50bp)");
    check('fmt(1234.5, "$m")', fmt(1234.5, "$m"), "$1,235m");
    check('fmt(-1234.5, "$m")', fmt(-1234.5, "$m"), "($1,235m)");
    check('fmt("1,250", "$m")', fmt("1,250", "$m"), "$1,250m");
    check('fmt(12.34, "$bn")', fmt(12.34, "$bn"), "$12.3bn");
    check('fmt(-0.75, "$bn")', fmt(-0.75, "$bn"), "($0.8bn)");
    check('fmt(40.1, "$")', fmt(40.1, "$"), "$40.10");
    check('fmt(-3.205, "$")', fmt(-3.205, "$"), "($3.21)");
    check('fmt(1.005, "$")', fmt(1.005, "$"), "$1.01");
    check('fmt(1234567.891, "num", 1)', fmt(1234567.891, "num", 1), "1,234,567.9");
    check('fmt(null, "x")', fmt(null, "x"), "n/a");
    check('fmt(Infinity, "x")', fmt(Infinity, "x"), "NM");
    check('fmt(NaN, "$")', fmt(NaN, "$"), "NM");
    // statistics: Excel QUARTILE.INC, NM and missing cells left out
    check("quantile([1,2,3,4], 0.25)", B.quantile([1, 2, 3, 4], 0.25), 1.75);
    check("quantile([1,2,3,4], 0.75)", B.quantile([1, 2, 3, 4], 0.75), 3.25);
    check("median([3,1,2])", B.median([3, 1, 2]), 2);
    check("median([4,1,3,2])", B.median([4, 1, 3, 2]), 2.5);
    check("median([NaN,1,null,3])", B.median([NaN, 1, null, 3]), 2);
    check("mean([1,2,NaN,6])", B.mean([1, 2, NaN, 6]), 3);
    check("multiple(1200, 100)", B.multiple(1200, 100), 12);
    check("multiple(4100, -35) is NM", B.multiple(4100, -35), NaN);
    check("multiple(18.10, 0.12) above 100x is NM", B.multiple(18.10, 0.12, 100), NaN);
    check("multiple(null, 5) is n/a", B.multiple(null, 5), null);
    // DCF against values worked out by hand (python, same formulas)
    check("dcf 100/110/121, 10% WACC, 2% growth", r4(B.dcf({fcf: [100, 110, 121], netDebt: 200, shares: 50}, 10, 2, "growth")), 24.6364);
    var m = FIX["sens-growth"].model, mx = FIX["sens-multiple"].model;
    check("dcf fixture base 9.0% / 3.0%", r4(B.dcf(m, 9, 3, "growth")), 41.3581);
    check("dcf fixture base, mid-year", r4(B.dcf({fcf: m.fcf, netDebt: m.netDebt, shares: m.shares, midYear: true}, 9, 3, "growth")), 43.6882);
    check("dcf fixture 9.0% / 12.0x exit", r4(B.dcf(mx, 9, 12, "multiple")), 43.4602);
    check("dcf with WACC at growth is NM", B.dcf(m, 3, 3, "growth"), NaN);
    // the pieces as drawn
    var q = function (sel) { return document.querySelector(sel); }, qa = function (sel) { return document.querySelectorAll(sel); };
    check("look", document.documentElement.dataset.look, (location.search.match(/look=(study|desk)/) || [0, "desk"])[1]);
    check("sens base cell", q("#sens-growth td.base").textContent, "$41.36");
    check("sens band cells", qa("#sens-growth td.band").length, 9);
    check("sens exit base cell", q("#sens-multiple td.base").textContent, "$43.46");
    check("sens source line", q("#sens-growth .source").textContent.indexOf("Source: Fixture"), 0);
    var compsCol = function (row, ci) { return q("#comps tbody tr." + row).children[ci + 1].textContent; };
    check("comps NM cells in peer rows", qa("#comps tr.peer td.nm").length, 2);
    check("comps 75th pct EV/EBITDA NTM", compsCol("stat.first", 4), "11.2x");
    check("comps mean EV/EBITDA NTM", q("#comps tbody").rows[7].children[5].textContent, "14.7x");
    check("comps median EV/EBITDA NTM", q("#comps tbody").rows[8].children[5].textContent, "10.8x");
    check("comps 25th pct EV/EBITDA NTM", q("#comps tbody").rows[9].children[5].textContent, "10.6x");
    check("comps median EV", q("#comps tbody").rows[8].children[1].textContent, "$10,650m");
    check("comps median P/E NTM (NM left out)", q("#comps tbody").rows[8].children[6].textContent, "16.0x");
    check("comps target EV/EBITDA NTM", compsCol("target", 4), "8.3x");
    check("no data-source shows [unclear]", q("#no-source").textContent.indexOf("[unclear]"), 0);
    check("bad numbers show [unclear]", q("#bad-json").textContent.indexOf("[unclear]"), 0);
    // the football's bars agree with the other fixtures
    var c = FIX.comps, ntm = c.peers.map(function (p) { return B.multiple(p.ev, p.ebitdaNtm); }), t = c.target, sh = m.shares, nd = m.netDebt;
    var bars = FIX.football.bars;
    check("football comps low = 25th pct x NWD NTM EBITDA", fmt((B.quantile(ntm, 0.25) * t.ebitdaNtm - nd) / sh, "$"), fmt(bars[2].low, "$"));
    check("football comps high = 75th pct x NWD NTM EBITDA", fmt((B.quantile(ntm, 0.75) * t.ebitdaNtm - nd) / sh, "$"), fmt(bars[2].high, "$"));
    var band = [8.5, 9, 9.5].map(function (w) { return [2.5, 3, 3.5].map(function (g) { return B.dcf(m, w, g, "growth"); }); }).reduce(function (a, b) { return a.concat(b); });
    check("football DCF low = band low", fmt(Math.min.apply(null, band), "$"), fmt(bars[4].low, "$"));
    check("football DCF high = band high", fmt(Math.max.apply(null, band), "$"), fmt(bars[4].high, "$"));
    check("football drawn", qa(".football canvas").length, 1);
    var s = q("#summary");
    s.textContent = "fmt and math: " + pass + " PASS, " + fail + " FAIL";
    s.className = fail ? "fail" : "pass";
    q("#asserts").textContent = rows.join("\n");
  });
</script>
